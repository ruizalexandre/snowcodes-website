<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>SNOWCODES — Oscilloscope</title>
<meta name="theme-color" content="#000000">
<style>
    /* Self-hosted fonts (latin subset), no third-party requests */
    @font-face { font-family: 'Share Tech Mono'; font-weight: 400; font-display: swap; src: url(/fonts/share-tech-mono-latin.woff2) format('woff2'); }
    /* A single beam on P31 green phosphor. The studio orange is kept for the front panel. */
    :root {
        --ph: #6dff9e;
        --glow: rgba(109, 255, 158, .55);
        --ink: #c4ecd1;
        --dim: #5f7a68;
        --orange: #ff5a00;
        --bezel: clamp(6px, 1.2vw, 12px);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: #020302 radial-gradient(80% 60% at 50% 42%, #0b1410, transparent 75%) fixed;
        color: var(--ink);
        font: 400 14px/1.5 'Share Tech Mono', ui-monospace, monospace;
    }
    a { color: inherit; }

    .bar {
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px;
        padding: 18px clamp(16px, 4vw, 40px);
        font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
    }
    .bar nav { display: flex; gap: 18px; }
    .bar nav a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--orange); }

    main { flex: 1; display: grid; place-items: center; padding: 4px 16px 8px; }
    /* The screen keeps the 10 × 8 divisions of a real graticule, sized to fit the viewport */
    .scope { width: min(100%, 1040px, max(300px, calc((100svh - 260px) * 1.25))); }

    .screen {
        position: relative; aspect-ratio: 5 / 4; overflow: hidden; cursor: pointer;
        border-radius: 4% / 5%; background: #000;
        box-shadow:
            0 0 0 var(--bezel) #0b0e0c,
            0 0 0 calc(var(--bezel) + 1px) #262c29,
            0 30px 90px -10px #000,
            0 0 160px rgba(109, 255, 158, .08);
    }
    .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #glow, #grid { mix-blend-mode: screen; }
    /* Curved glass: vignette and a faint reflection */
    .screen::after {
        content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
        background:
            linear-gradient(160deg, rgba(255, 255, 255, .07), transparent 32%),
            radial-gradient(120% 100% at 50% 50%, transparent 58%, rgba(0, 0, 0, .55));
        box-shadow: inset 0 0 50px rgba(0, 0, 0, .85);
    }

    .ro {
        position: absolute; left: 3%; right: 3%; z-index: 2;
        display: flex; justify-content: space-between; gap: 1em; white-space: pre;
        font-size: clamp(9px, 1.3vw, 13px); letter-spacing: .06em;
        color: var(--ph); text-shadow: 0 0 6px var(--glow);
    }
    .ro.top { top: 2.5%; }
    .ro.bot { bottom: 2.5%; }
    .st { padding: 0 .5em; border-radius: 2px; background: rgba(109, 255, 158, .15); }
    .paused .st { color: var(--orange); background: rgba(255, 90, 0, .15); text-shadow: 0 0 6px rgba(255, 90, 0, .6); }

    /* Measurement cursors, drawn by the digital layer as on a DSO */
    .cur { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .5s; }
    .meas .cur { opacity: 1; }
    .cur i { position: absolute; top: 0; bottom: 0; left: 20%; border-left: 1px dashed var(--orange); }
    .cur i + i { left: 80%; }
    .cur b {
        position: absolute; top: 9%; left: 50%; transform: translateX(-50%);
        font-weight: 400; font-size: clamp(10px, 1.5vw, 15px); color: var(--orange); text-shadow: 0 0 8px rgba(255, 90, 0, .7);
    }

    .ctl { display: flex; align-items: center; gap: 14px; margin-top: calc(var(--bezel) + 18px); }
    .ctl button {
        flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
        border: 1px solid #2b3530; background: #0c100e; color: var(--ph); cursor: pointer;
    }
    .ctl svg { fill: currentColor; }
    .paused .i-pause, .scope:not(.paused) .i-play { display: none; }
    .ctl input { flex: 1; min-width: 0; accent-color: var(--ph); }
    .cta {
        flex: none; padding: 10px 16px; border-radius: 4px; background: var(--orange); color: #fff;
        text-decoration: none; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    }
    .ctl :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

    .cap { min-height: 3.2em; margin-top: 16px; text-align: center; text-wrap: balance; font-size: clamp(13px, 1.6vw, 16px); animation: cap .6s ease both; }
    @keyframes cap { from { opacity: 0; transform: translateY(6px); } }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
        .cap { animation: none; }
        .cur { transition: none; }
    }
</style>

<script>
    const copy = {
        fr: {
            back: '← Showcase', other: 'EN', otherHref: '?lang=en', showcase: '/showcase/', contact: '/#contact',
            cta: 'Nous écrire', play: 'Lecture', pause: 'Pause', seek: 'Position dans l’animation',
            label: 'Animation\u00a0: le faisceau d’un oscilloscope trace la présentation du studio SNOWCODES.',
            colophon: 'Phosphore P31 · un seul faisceau · aucune vidéo',
            talk: 'PARLONS-EN.',
            services: ['DÉVELOPPEMENT\nSUR MESURE', 'MOTION\nDESIGN', 'SITES ÉDITABLES\nPAR IA', 'CODE AUGMENTÉ\nPAR L’IA', 'MAÎTRISE\nTECHNOLOGIQUE', 'ACCOMPAGNEMENT\nCONTINU'],
            facts: 'DEPUIS 2021 · 10+ ANS · FRANCE',
            caps: {
                intro: 'Studio indépendant de développement web et mobile, de motion design et de sites éditables par IA. En France, depuis 2021.',
                verbs: 'Code. Create. Explore.',
                xy: 'Du code au mouvement, une seule exigence\u00a0: chaque détail compte.',
                s0: 'Web et mobile, qualité et performance, pensés pour durer dès le premier jour.',
                s1: 'Interfaces animées, logos en mouvement, expériences interactives à 60\u00a0fps.',
                s2: 'Des sites statiques rapides, que vous mettez à jour vous-même en le demandant à une IA.',
                s3: 'Claude Code, Codex, Cursor, Grok Bot\u00a0: les meilleurs agents IA, sans rien céder sur la qualité.',
                s4: 'Mobile avec Flutter, web avec Angular et React\u00a0: plus de 10\u00a0ans d’expérience.',
                s5: 'Du cadrage à la mise en production, un suivi itératif aligné sur vos objectifs.',
                meas: 'Particulier ou professionnel, décrivez-nous votre besoin\u00a0: nous répondons sous 48\u00a0heures.',
                manifesto: 'Trois verbes, une seule règle. Nous construisons des logiciels comme on façonne un objet\u00a0: avec patience, retenue et attention à chaque détail.',
                end: 'Parlons de votre projet.',
            },
        },
        en: {
            back: '← Showcase', other: 'FR', otherHref: '?', showcase: '/en/showcase/', contact: '/en/#contact',
            cta: 'Get in touch', play: 'Play', pause: 'Pause', seek: 'Position in the animation',
            label: 'Animation: an oscilloscope beam traces the SNOWCODES studio story.',
            colophon: 'P31 phosphor · one beam · no video',
            talk: 'LET’S TALK.',
            services: ['CUSTOM\nDEVELOPMENT', 'MOTION\nDESIGN', 'AI-EDITABLE\nWEBSITES', 'AI-AUGMENTED\nCODING', 'TECHNICAL\nMASTERY', 'ONGOING\nSUPPORT'],
            facts: 'SINCE 2021 · 10+ YRS · FRANCE',
            caps: {
                intro: 'Independent studio for web and mobile development, motion design and AI-editable websites. Based in France, since 2021.',
                verbs: 'Code. Create. Explore.',
                xy: 'From code to motion, one standard: every detail matters.',
                s0: 'Web and mobile, quality and performance, built to last from day one.',
                s1: 'Animated interfaces, logos in motion, interactive experiences at 60\u00a0fps.',
                s2: 'Fast static websites you update yourself, just by asking an AI.',
                s3: 'Claude Code, Codex, Cursor, Grok Bot: the best AI agents, with no compromise on quality.',
                s4: 'Mobile with Flutter, web with Angular and React: over 10\u00a0years of experience.',
                s5: 'From scoping to production, iterative follow-through aligned with your goals.',
                meas: 'Individual or business, tell us what you need: we reply within 48\u00a0hours.',
                manifesto: 'Three verbs, one rule. We build software the way you would shape an object: with patience, restraint and attention to every detail.',
                end: 'Let’s talk about your project.',
            },
        },
    };

    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
    const C = copy[lang];
    const $ = (id) => document.getElementById(id);
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = C[el.dataset.k]; });
    $('back').href = C.showcase;
    $('cta').href = C.contact;
    $('lang').textContent = C.other;
    $('lang').href = C.otherHref;
    $('crt').setAttribute('aria-label', C.label);
    $('seek').setAttribute('aria-label', C.seek);

    // ── Vector font: 8 × 12 grid, origin top-left, one base-36 digit per coordinate, strokes split by spaces ──
    const FONT = {
        A: '0c0440848c 0787', B: '0666888a6c0c0060828466', C: '826020020a2c6c8a', D: '005083895c0c00',
        E: '80000c8c 0666', F: '80000c 0666', G: '826020020a2c6c8a8646', H: '000c 808c 0686',
        I: '0040 202c 0c4c', J: '808a6c2c0a08', K: '000c 80068c', L: '000c8c', M: '0c0046808c',
        N: '0c008c80', O: '2060828a6c2c0a0220', P: '0c006082856707', Q: '2060828a6c2c0a0220 598c',
        R: '0c006082856707 478c', S: '82602002042666888a6c2c0a', T: '0080 404c', U: '000a2c6c8a80',
        V: '004c80', W: '002c466c80', X: '008c 800c', Y: '004680 464c', Z: '00800c8c',
        0: '2060828a6c2c0a0220 820a', 1: '22404c 2c6c', 2: '02206082840c8c', 3: '022060828466888a6c2c0a 3666',
        4: '6c600888', 5: '80000565878a6c0c', 6: '826020020a2c6c8a886606', 7: '00803c',
        8: '260402206082846626080a2c6c8a8866', 9: '0a2c6c8a82602002042686',
        '.': '0b1b1c0c0b', ',': '1b1c0e', ':': '0313140403 0b1b1c0c0b', '-': '1676', '+': '1676 4349',
        '/': '0c60', '’': '101204', '<': '62066a', '>': '02660a', '·': '0515160605',
    };
    // Accents come from NFD: 'É' → 'E' + U+0301, drawn over the previous glyph.
    const MARKS = {
        '\u0300': [[3, -3, 5, -1]], '\u0301': [[3, -1, 5, -3]], '\u0302': [[2, -1, 4, -3, 6, -1]],
        '\u0308': [[2, -3, 2, -2], [6, -3, 6, -2]], '\u0327': [[4, 12, 4, 13, 5, 14, 3, 15]],
    };
    const GLYPHS = {}, WIDTH = {};
    for (const [ch, s] of Object.entries(FONT)) {
        GLYPHS[ch] = s.split(' ').map((st) => [...st].map((c) => parseInt(c, 36)));
        WIDTH[ch] = Math.max(...GLYPHS[ch].flat().filter((_, i) => i % 2 === 0));
    }

    // Strokes in screen divisions (x −5…5, y −4…4, y up), centred on (cx, cy), cap height h, squeezed to fit width w.
    // fill stretches every line to w, like the stacked SNOW / CODES logo.
    function text(str, cx, cy, h, w = 9.4, lh = 1.7, fill = false) {
        const lines = str.toUpperCase().normalize('NFD').split('\n').map((line) => {
            const out = [];
            let pen = 0, at = 0, gw = 8;
            for (const ch of line) {
                const mark = MARKS[ch];
                if (mark) { for (const s of mark) out.push(s.map((v, i) => (i % 2 ? v : v + at + (gw - 8) / 2))); continue; }
                const g = GLYPHS[ch] || [];
                for (const s of g) out.push(s.map((v, i) => (i % 2 ? v : v + pen)));
                at = pen; gw = g.length ? WIDTH[ch] : 2; pen += gw + 4;
            }
            return { out, w: Math.max(1, pen - 4) };
        });
        const s = Math.min(h / 12, w / Math.max(...lines.map((l) => l.w))), step = 12 * lh * s;
        const top = cy + (12 * s + (lines.length - 1) * step) / 2;
        return lines.flatMap((l, j) => {
            const sx = fill ? w / l.w : s, x0 = cx - (l.w * sx) / 2, y0 = top - j * step;
            return l.out.map((st) => st.map((v, i) => (i % 2 ? y0 - v * s : x0 + v * sx)));
        });
    }

    // ── The beam: N samples per frame. B[i] lights the move from sample i−1 to i:
    // 1 along a stroke, JUMP for the blanked move between strokes (still faintly visible, as on a real scope). ──
    const N = 2000, JUMP = 0.06, TAU = Math.PI * 2;
    const F = () => ({ X: new Float32Array(N), Y: new Float32Array(N), B: new Float32Array(N) });
    const put = (f, src) => { f.X.set(src.X); f.Y.set(src.Y); f.B.set(src.B); };
    const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const ease = (v) => v * v * (3 - 2 * v);
    const out3 = (v) => 1 - (1 - v) ** 3;

    // Spread samples o … o+n−1 along the strokes by arc length, both ends of every stroke included.
    // Every figure has the same N samples, so any two of them morph into each other with a plain lerp.
    function trace(strokes, f, o = 0, n = N - o) {
        const len = strokes.map((s) => {
            let l = 0;
            for (let i = 2; i < s.length; i += 2) l += Math.hypot(s[i] - s[i - 2], s[i + 1] - s[i - 1]);
            return l;
        });
        const L = len.reduce((a, b) => a + b, 0) || 1, free = Math.max(0, n - 2 * strokes.length);
        let acc = 0, used = 0, i = o;
        strokes.forEach((s, k) => {
            const c = 2 + Math.round(((acc += len[k]) / L) * free) - used;
            used += c - 2;
            for (let j = 0, p = 0, d0 = 0; j < c; j++, i++) {
                const d = (len[k] * j) / (c - 1);
                let sl = Math.hypot(s[p + 2] - s[p], s[p + 3] - s[p + 1]);
                while (d > d0 + sl && p + 4 < s.length) { d0 += sl; p += 2; sl = Math.hypot(s[p + 2] - s[p], s[p + 3] - s[p + 1]); }
                const u = sl ? Math.min(1, (d - d0) / sl) : 0;
                f.X[i] = s[p] + (s[p + 2] - s[p]) * u;
                f.Y[i] = s[p + 1] + (s[p + 3] - s[p + 1]) * u;
                f.B[i] = j ? (s.b ?? 1) : JUMP;
            }
        });
    }

    // Beam writing: samples past p wait on a tight spot at the beam head, which makes it glow.
    function writeOn(f, p, o = 0, e = N) {
        const k = o + Math.round((e - o - 1) * clamp(p));
        for (let i = k + 1; i < e; i++) {
            f.X[i] = f.X[k] + 0.05 * Math.cos(i * 2.4);
            f.Y[i] = f.Y[k] + 0.05 * Math.sin(i * 2.4);
            f.B[i] = 1;
        }
    }

    // Self-check: every glyph and accent traces, and trace() fills its whole range.
    const chk = F();
    chk.X.fill(NaN);
    trace(text(Object.keys(FONT).join('') + 'ÀÉÈÊËÎÇ', 0, 0, 1), chk);
    console.assert(!chk.X.some(isNaN) && !chk.Y.some(isNaN), 'trace() left samples unset');

    // ── Figures ──
    const poly = (fn, n) => { const s = []; for (let i = 0; i <= n; i++) s.push(...fn(i / n)); return s; };
    const rect = (x0, y0, x1, y1) => [x0, y0, x1, y0, x1, y1, x0, y1, x0, y0];
    const dot = (x, y, r) => poly((u) => [x + r * Math.cos(u * TAU), y + r * Math.sin(u * TAU)], 8);
    const dim = (s, b) => Object.assign(s, { b });
    const sine = (y, a, cycles, ph, w = 4.6) => poly((u) => [-w + 2 * w * u, y + a * Math.sin(TAU * cycles * u + ph)], 240);
    const chirp = (y, a, ph) => poly((u) => [-4.6 + 9.2 * u, y + a * Math.sin(TAU * (1.2 * u + 3.2 * u * u) + ph)], 320);

    // Square wave, the analog way: the beam crosses the edges so fast they barely light up.
    function square(y, a, P, ph) {
        const out = [];
        for (let x = -4.6, n = Math.floor((x + ph) / (P / 2)); x < 4.6; n++) {
            const xe = Math.min(4.6, ((n + 1) * P) / 2 - ph), v = y + (n & 1 ? -a : a);
            out.push([x, v, xe, v]);
            if (xe < 4.6) out.push(dim([xe, v, xe, 2 * y - v], 0.3));
            x = xe;
        }
        return out;
    }

    function lissajous(t, f) {
        for (let i = 0; i < N; i++) {
            const a = (i / (N - 1)) * TAU;
            f.X[i] = 3.7 * Math.sin(3 * a + t * 0.9);
            f.Y[i] = 3.1 * Math.sin(2 * a);
            f.B[i] = 1;
        }
    }

    function cube(t) {
        const a = t * 0.9, b = 0.5 + t * 0.5, P = [];
        for (let i = 0; i < 8; i++) {
            const x = i & 1 ? 1 : -1, y = i & 2 ? 1 : -1, z = i & 4 ? 1 : -1;
            const x1 = x * Math.cos(a) + z * Math.sin(a), z1 = z * Math.cos(a) - x * Math.sin(a);
            const y1 = y * Math.cos(b) - z1 * Math.sin(b), z2 = z1 * Math.cos(b) + y * Math.sin(b), k = 0.9 / (1 + z2 * 0.18);
            P.push([x1 * k, 1.6 + y1 * k]);
        }
        return [[0, 1, 3, 2, 0], [4, 5, 7, 6, 4], [0, 4], [1, 5], [2, 6], [3, 7]].map((ids) => ids.flatMap((v) => P[v]));
    }

    function web(t) {
        const L = 0.05 + 2.6 * clamp((t % 1.6) / 1.2);   // a line being typed in, again and again
        const s = [rect(-2.1, 0.3, 2.1, 2.9), [-2.1, 2.45, 2.1, 2.45], dot(-1.8, 2.68, 0.07), dot(-1.55, 2.68, 0.07), dot(-1.3, 2.68, 0.07),
            [-1.6, 1.95, 1, 1.95], [-1.6, 1.45, 1.6, 1.45], [-1.6, 0.95, -1.6 + L, 0.95]];
        if ((t * 2.5) % 1 < 0.6) s.push([-1.45 + L, 0.75, -1.45 + L, 1.15]);
        return s;
    }

    const star = (x, y, r, a) => poly((u) => {
        const i = Math.round(u * 8), R = i % 2 ? r * 0.22 : r;
        return [x + R * Math.cos(a + (i * Math.PI) / 4), y + R * Math.sin(a + (i * Math.PI) / 4)];
    }, 8);
    const sparkle = (t) => [star(-0.3, 1.5, 1.3 * (1 + 0.06 * Math.sin(t * 5)), Math.PI / 2 + t * 0.4), star(1.5, 2.6, 0.45, Math.PI / 2 - t)];

    const lemni = (u) => {
        const a = u * TAU, d = 1 + Math.sin(a) ** 2;
        return [(2.4 * Math.cos(a)) / d, 1.6 + (3.2 * Math.sin(a) * Math.cos(a)) / d];
    };
    const lemniscate = (t) => [poly(lemni, 120), dot(...lemni((t * 0.45) % 1), 0.08)];

    const BRACKETS = text('</>', 0, 1.6, 2.2);
    const DEVICES = [rect(-2.5, 1, 0.5, 2.9), [-1, 1, -1, 0.55], [-1.6, 0.55, -0.4, 0.55], rect(1.1, 0.4, 2.2, 2.6), [1.45, 2.4, 1.85, 2.4], ...text('10+', -1, 1.95, 0.8)];
    const ICONS = [() => BRACKETS, cube, web, sparkle, () => DEVICES, lemniscate];
    const TITLES = C.services.map((s) => text(s, 0, -1.75, 0.62, 9.2));
    const VERBS = ['CODE.', 'CREATE.', 'EXPLORE.'].map((w) => text(w, 0, 1.25, 1.5, 8.6));
    const PULSE = [[-5.2, -2.2, -3, -2.2], dim([-3, -2.2, -3, 1.6], 0.3), [-3, 1.6, 3, 1.6], dim([3, 1.6, 3, -2.2], 0.3), [3, -2.2, 5.2, -2.2]];

    const LOGO = F(), MEAS = F(), MANI = F(), END = F();
    trace([...text('SNOW\nCODES', 0, 0, 1.45, 8.2, 1.3, true), rect(-4.6, -2.15, 4.6, 2.15)], LOGO);
    trace(PULSE, MEAS, 0, 700);
    trace(text('< 48 H', 0, -0.3, 1.1), MEAS, 700);
    trace(text('EVERYTHING\nMATTERS.', 0, 0.1, 1.15, 9), MANI);
    trace(text(C.talk, 0, 0.55, 1.2, 9), END, 0, 1500);
    trace(text('SNOWCODES.FR', 0, -1.35, 0.42), END, 1500);

    // ── Scenes: d duration, m morph-in time (taken from the end of the previous scene), f(t, frame) ──
    const still = (src) => (t, f) => put(f, src);
    const verb = (word, wave) => (t, f) => { trace(word, f, 0, 1100); trace(wave(t), f, 1100); };
    const scenes = [
        { d: 2.4, ro: 'CH1 OFF', f: (t, f) => {        // power on: a dot warms up, then opens into the trace
            const w = 5.2 * out3(clamp((t - 0.8) / 0.9)) + 0.02, on = clamp(t / 0.6);
            trace([[-w, 0, w, 0]], f);
            for (let i = 0; i < N; i++) f.B[i] *= on;
        } },
        { d: 2.6, m: 0.3, cap: 'intro', f: (t, f) => {  // a signal grows, drifts, then the trigger catches it
            trace([sine(0, 2.2 * out3(clamp(t / 1.5)), 2.5, 5 * Math.max(0, 1.3 - t) ** 2, 5.2)], f);
        } },
        { d: 3.8, m: 1.1, cap: 'intro', alt: 'SNOWCODES', f: still(LOGO) },
        { d: 2.3, m: 0.7, cap: 'verbs', ro: 'CH1 1.00V   SQUARE', f: verb(VERBS[0], (t) => square(-1.75, 0.75, 2, t * 1.5)) },
        { d: 2.3, m: 0.7, cap: 'verbs', ro: 'CH1 1.00V   SINE', f: verb(VERBS[1], (t) => [sine(-1.75, 0.75, 4.5, -t * 5)]) },
        { d: 2.3, m: 0.7, cap: 'verbs', ro: 'CH1 1.00V   CHIRP', f: verb(VERBS[2], (t) => [chirp(-1.75, 0.75, -t * 6)]) },
        { d: 4.2, m: 0.9, cap: 'xy', xy: true, ro: 'X 1.00V   Y 1.00V   3:2', f: lissajous },
        ...TITLES.map((title, k) => ({
            d: 2.8, m: 0.7, cap: 's' + k, alt: C.services[k].replace('\n', ' '), ro: `SVC ${k + 1}/6`,
            f: (t, f) => { trace(ICONS[k](t), f, 0, 640); trace(title, f, 640); },
        })),
        { d: 4.6, m: 0.8, cap: 'meas', alt: '< 48 h', ro: C.facts, cursors: true, f: still(MEAS) },
        { d: 5.2, m: 0.6, cap: 'manifesto', alt: 'Everything matters.', f: (t, f) => {  // written, then a wave runs through it
            put(f, MANI);
            writeOn(f, t / 1.9);
            const a = 0.32 * Math.sin(Math.PI * clamp((t - 2.5) / 2.2));
            for (let i = 0; a && i < N; i++) f.Y[i] += a * Math.sin(f.X[i] * 1.6 - t * 7);
        } },
        { d: 3.8, m: 0.6, cap: 'end', alt: C.talk, ro: 'SNOWCODES.FR', f: (t, f) => { put(f, END); writeOn(f, t / 1.5); } },
        { d: 2.6, m: 0.2, cap: 'end', ro: 'CH1 OFF', f: (t, f) => {  // power off: collapse to a line, then a dot, then dark
            put(f, END);
            const v = Math.max(0.003, 1 - ease(clamp(t / 0.35))), h = Math.max(0.003, 1 - ease(clamp((t - 0.3) / 0.35))), b = 1 - clamp((t - 0.7) / 0.9);
            for (let i = 0; i < N; i++) { f.X[i] *= h; f.Y[i] *= v; f.B[i] *= b; }
        } },
    ];
    const TOTAL = scenes.reduce((a, s) => a + s.d, 0);

    const OUT = F(), NEXT = F();
    // Fills OUT for time t and returns the scene on display (the next one as soon as the morph into it starts).
    function frameAt(t) {
        let k = 0, s = 0;
        while (k < scenes.length - 1 && t >= s + scenes[k].d) s += scenes[k++].d;
        const sc = scenes[k], nx = scenes[(k + 1) % scenes.length], m = nx.m || 0, u = t - s;
        sc.f(u, OUT);
        const e = m ? (u - sc.d + m) / m : 0;
        if (e <= 0) return k;
        nx.f(0, NEXT);
        const w = ease(clamp(e));
        for (let i = 0; i < N; i++) {
            OUT.X[i] += (NEXT.X[i] - OUT.X[i]) * w;
            OUT.Y[i] += (NEXT.Y[i] - OUT.Y[i]) * w;
            OUT.B[i] += (NEXT.B[i] - OUT.B[i]) * w;
        }
        return (k + 1) % scenes.length;
    }

    // ── Phosphor: the trace canvas is never cleared, only faded; bloom is a downsampled copy screened on top ──
    const crt = $('crt'), cv = $('trace'), ctx = cv.getContext('2d', { alpha: false });
    const gl = $('glow'), gx = gl.getContext('2d');   // 1/2 scale, stretched back by the browser
    const c4 = document.createElement('canvas'), c8 = document.createElement('canvas'), c16 = document.createElement('canvas');
    const x4 = c4.getContext('2d'), x8 = c8.getContext('2d'), x16 = c16.getContext('2d');
    const gr = $('grid'), grx = gr.getContext('2d');
    const LV = 8;   // brightness levels, one stroke() each
    let W = 0, H = 0, dpr = 1, LW = 2, playing = false;

    function resize() {
        const r = crt.getBoundingClientRect();
        dpr = Math.min(2, devicePixelRatio || 1);
        W = cv.width = gr.width = Math.round(r.width * dpr);
        H = cv.height = gr.height = Math.round(r.height * dpr);
        gl.width = W >> 1; gl.height = H >> 1;
        c4.width = W >> 2; c4.height = H >> 2;
        c8.width = W >> 3; c8.height = H >> 3;
        c16.width = W >> 4; c16.height = H >> 4;
        LW = Math.min(2.4, Math.max(1.3, r.width / 480)) * dpr;
        // Graticule: dotted divisions, ticks every 0.2 div on the centre axes
        const px = (d) => ((d + 5) * W) / 10, py = (d) => ((4 - d) * H) / 8, s = dpr;
        grx.fillStyle = 'rgba(130, 230, 170, .3)';
        for (let i = -5; i <= 5; i++) for (let j = -20; j <= 20; j++) grx.fillRect(px(i) - s / 2, py(j / 5) - s / 2, s, s);
        for (let j = -4; j <= 4; j++) for (let i = -25; i <= 25; i++) grx.fillRect(px(i / 5) - s / 2, py(j) - s / 2, s, s);
        for (let i = -25; i <= 25; i++) grx.fillRect(px(i / 5) - s / 2, py(0) - 3 * s, s, 6 * s);
        for (let j = -20; j <= 20; j++) grx.fillRect(px(0) - 3 * s, py(j / 5) - s / 2, 6 * s, s);
    }

    function draw(f, dt) {
        if (!c16.height) return;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgba(0, 0, 0, ${1 - Math.exp(-dt / 0.06)})`;   // decay, τ = 60 ms
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'color-burn';   // clips the last 8-bit levels, which a fade alone never clears (ghosts)
        ctx.fillStyle = '#f8f8f8';
        ctx.fillRect(0, 0, W, H);

        // Brightness follows dwell time: short moves glow, long ones (jumps, stretched morphs) fade out.
        const ux = W / 10, uy = H / 8, jit = playing ? 0.01 : 0, ox = (Math.random() - 0.5) * jit, oy = (Math.random() - 0.5) * jit;
        const P = Array.from({ length: LV }, () => new Path2D()), end = new Int32Array(LV).fill(-1);
        let px = (f.X[0] + 5 + ox) * ux, py = (4 - f.Y[0] + oy) * uy;
        for (let i = 1; i < N; i++) {
            const x = (f.X[i] + 5 + ox + (Math.random() - 0.5) * jit) * ux, y = (4 - f.Y[i] + oy + (Math.random() - 0.5) * jit) * uy;
            const len = Math.hypot(f.X[i] - f.X[i - 1], f.Y[i] - f.Y[i - 1]);
            const b = Math.ceil(Math.min(1, f.B[i] * Math.min(1, 0.06 / len)) * LV) - 1;
            if (b >= 0) {
                if (end[b] !== i - 1) P[b].moveTo(px, py);
                P[b].lineTo(x, y);
                end[b] = i;
            }
            px = x; py = y;
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = LW;
        ctx.lineCap = ctx.lineJoin = 'round';
        const k = Math.min(dt, 0.05) * 60 * 0.3;   // per-frame energy, so the glow doesn't depend on the refresh rate
        for (let b = 0; b < LV; b++) {
            ctx.strokeStyle = `rgba(100, 255, 130, ${((b + 1) / LV) * k})`;
            ctx.stroke(P[b]);
        }

        // Bloom: halve down to 1/16 (each step an exact 2 × 2 average, so thin lines don't alias into beads),
        // then double back up, adding each level on the way: tight, mid and wide halos without blocks.
        gx.globalCompositeOperation = x4.globalCompositeOperation = x8.globalCompositeOperation = x16.globalCompositeOperation = 'copy';
        gx.drawImage(cv, 0, 0, gl.width, gl.height);
        x4.drawImage(gl, 0, 0, c4.width, c4.height);
        x8.drawImage(c4, 0, 0, c8.width, c8.height);
        x16.drawImage(c8, 0, 0, c16.width, c16.height);
        gx.globalCompositeOperation = x4.globalCompositeOperation = x8.globalCompositeOperation = 'lighter';
        x8.drawImage(c16, 0, 0, c8.width, c8.height);
        x4.drawImage(c8, 0, 0, c4.width, c4.height);
        gx.drawImage(c4, 0, 0, gl.width, gl.height);
    }

    // ── Transport ──
    const scope = $('scope'), cap = $('cap'), seek = $('seek'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t = reduce ? 6.6 : 0, last = 0, shown = -1;   // reduced motion: hold on the logo until play is pressed
    seek.max = TOTAL;

    function show(k) {
        const sc = scenes[k], c = C.caps[sc.cap] || '';
        shown = k;
        if (cap.textContent !== c) {
            cap.textContent = c;
            cap.style.animation = 'none';
            cap.offsetWidth;   // restart the fade-in
            cap.style.animation = '';
        }
        $('ro').textContent = sc.ro || 'CH1 1.00V   M 1.00ms';
        $('mode').textContent = sc.xy ? 'X-Y' : 'Y-T';
        $('count').textContent = `${String(k + 1).padStart(2, '0')}/${scenes.length}`;
        crt.classList.toggle('meas', !!sc.cursors);
    }

    function play(on) {
        playing = on;
        scope.classList.toggle('paused', !on);
        $('play').setAttribute('aria-label', on ? C.pause : C.play);
        $('st').textContent = on ? 'RUN' : 'STOP';
    }

    $('play').addEventListener('click', () => play(!playing));
    crt.addEventListener('click', () => play(!playing));
    seek.addEventListener('input', () => { t = +seek.value; });
    new ResizeObserver(resize).observe(crt);
    play(!reduce);

    // Transcript for screen readers: what the beam writes, and the captions, in order.
    for (const line of new Set(scenes.flatMap((s) => [s.alt, C.caps[s.cap]]).filter(Boolean))) {
        $('sr').append(Object.assign(document.createElement('p'), { textContent: line }));
    }

    requestAnimationFrame(function loop(now) {
        requestAnimationFrame(loop);
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (playing) t = (t + dt) % TOTAL;
        const k = frameAt(t);
        if (k !== shown) show(k);
        draw(OUT, dt);
        seek.value = t;
    });
</script>
</body>
</html>
