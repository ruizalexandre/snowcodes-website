<!doctype html>
<html lang="en">

<title>SNOWCODES — Skills reel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// SNOWCODES — skills reel, 1080×1920 @ 60 fps, 128 BPM, 40 beats = 10 bars = 18.75 s (loops on the grid).
// Story: a product is built live, idea → code → motion → AI → proof → ship; the HUD bar is the pipeline.
// Same contract as index.html: draw(t) is a pure function of time; render.mjs captures it with the WebAudio score.
// Open this file directly: click to play with sound, ?t=5.2 shows a still.
'use strict';
const W = 1080, H = 1920, FPS = 60, B = 60 / 128, BEATS = 40, DUR = BEATS * B;
const OR = '#EE431C', WH = '#FFFFFF', BK = '#0A0A0A', GR = '#8E8E8E';
const MONO = '"JetBrains Mono", Menlo, monospace', SANS = 'Inter, "Helvetica Neue", Arial, sans-serif';

// ── Logo geometry, in px of public/assets/SNOWCODES+LOGO+FULL.png (same as index.html) ──
const LG = {
    w: 9249, h: 12822, bd: 72, blockY: 8636,
    sx: 525, sw: 8198,
    stripes: [[462, 1566], [2224, 783], [3203, 391], [3790, 196], [4182, 98], [4457, 100]],
    u: 313.6, rowH: 320, rowY: [5008, 5428, 5849, 6269, 6690], colX: [525, 5272],
    wm: { x: 600, y: 9080, k: 3 },
};
const CODE = { S: '...', N: '-.', O: '---', W: '.--', C: '-.-.', D: '-..', E: '.' };
const ELS = [];
{
    let k = 0;
    [...'SNOWCODES'].forEach((ch, i) => {
        const word = i < 4 ? 0 : 1, li = i - 4 * word;
        if (i === 4) k += 4;
        let x = 0;
        for (const s of CODE[ch]) {
            const n = s === '.' ? 1 : 3;
            ELS.push({ row: i, n, lx: LG.colX[word] + x * LG.u, ly: LG.rowY[li] });
            x += n + 1; k += n + 1;
        }
        k += 2;
    });
}

// ── math ──
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
    outCubic: p => 1 - (1 - p) ** 3,
    inOutCubic: p => p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2,
    outExpo: p => p >= 1 ? 1 : 1 - 2 ** (-10 * p),
    inExpo: p => p <= 0 ? 0 : 2 ** (10 * p - 10),
    inOutExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? 2 ** (20 * p - 10) / 2 : (2 - 2 ** (-20 * p + 10)) / 2,
    outBack: p => 1 + 2.70158 * (p - 1) ** 3 + 1.70158 * (p - 1) ** 2,
    outElastic: p => p <= 0 ? 0 : p >= 1 ? 1 : 2 ** (-10 * p) * Math.sin((p * 10 - 0.75) * 2.0944) + 1,
    outBounce: p => {
        const n = 7.5625, d = 2.75;
        return p < 1 / d ? n * p * p : p < 2 / d ? n * (p -= 1.5 / d) * p + 0.75 : p < 2.5 / d ? n * (p -= 2.25 / d) * p + 0.9375 : n * (p -= 2.625 / d) * p + 0.984375;
    },
};
const hash = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const bump = (b, at, k = 9) => b < at ? 0 : Math.exp(-(b - at) * k);   // decaying pulse, in beats
let seed = 7;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ── drawing ──
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
const img = new Image();
img.src = 'wordmark.png';
const ATL = {};
function atlas(c) {
    if (ATL[c]) return ATL[c];
    const a = document.createElement('canvas'), x = a.getContext('2d');
    a.width = img.width; a.height = img.height;
    x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = c; x.fillRect(0, 0, a.width, a.height);
    return ATL[c] = a;
}
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const rr = (x, y, w, h, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, r)); ctx.fill(); };
const rrs = (x, y, w, h, r, c, lw = 2) => { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, r)); ctx.stroke(); };
const circle = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); };
const bg = c => { ctx.setTransform(1, 0, 0, 1, 0, 0); rect(0, 0, W, H, c); };
const line = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
function cam(cx, cy, s, r = 0, sx = W / 2, sy = H / 2) {            // world point (cx, cy) → screen (sx, sy)
    ctx.setTransform(1, 0, 0, 1, sx, sy); ctx.rotate(r); ctx.scale(s, s); ctx.translate(-cx, -cy);
}
function txt(s, x, y, size, { font = MONO, weight = 400, color = WH, align = 'left', ls = 0, alpha = 1, base = 'alphabetic' } = {}) {
    ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${ls}px`; ctx.textAlign = align; ctx.textBaseline = base;
    const a = ctx.globalAlpha;
    ctx.fillStyle = color; ctx.globalAlpha = a * alpha; ctx.fillText(s, x, y); ctx.globalAlpha = a; ctx.letterSpacing = '0px';
}
const tw = (s, size, weight = 900, font = SANS, ls = 0) => {
    ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${ls}px`;
    const w = ctx.measureText(s).width;
    ctx.letterSpacing = '0px';
    return w;
};
const fit = (s, maxW, size, weight = 900, font = SANS, ls = 0) => Math.min(size, size * maxW / tw(s, size, weight, font, ls));
function chars(s, x, y, size, o, f) {                               // per-letter transform f(i) → [dx, dy, sx, sy, rot, alpha]
    const { font = SANS, weight = 900, color = WH, ls = 0, align = 'center', colorAt } = o;
    ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${ls}px`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const full = ctx.measureText(s).width - ls, x0 = align === 'center' ? x - full / 2 : x, a0 = ctx.globalAlpha;
    [...s].forEach((ch, i) => {
        const r = f(i);
        if (!r) return;
        const [dx, dy, sx, sy, rot, al] = r, px = ctx.measureText(s.slice(0, i)).width, cw = ctx.measureText(ch).width - ls;
        ctx.save(); ctx.translate(x0 + px + cw / 2 + dx, y + dy); ctx.rotate(rot); ctx.scale(sx, sy);
        ctx.globalAlpha = a0 * al; ctx.fillStyle = colorAt?.(i) ?? color; ctx.fillText(ch, -cw / 2, 0); ctx.restore();
    });
    ctx.letterSpacing = '0px';
}
function rise(s, y, size, b, b0, o = {}, stagger = 0.025) {        // a centred line, letters rising out of a mask
    ctx.save(); ctx.beginPath(); ctx.rect(0, y - size, W, size * 1.3); ctx.clip();
    chars(s, W / 2, y, size, o, i => { const q = E.outExpo(prog(b, b0 + i * stagger, b0 + i * stagger + 0.55)); return [0, (1 - q) * size * 1.25, 1, 1, 0, 1]; });
    ctx.restore();
}
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>/';
function scramble(from, to, p, k) {                                 // letters decode left → right
    let s = '';
    for (let i = 0, n = Math.max(from.length, to.length); i < n; i++) {
        const l = i / n * 0.7;
        s += p > l + 0.3 ? to[i] ?? '' : p > l ? GLYPHS[Math.floor(hash(i, k) * GLYPHS.length)] : from[i] ?? '';

    return s;
}
function arrowUp(x, y, s, c, lw) {
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    ctx.moveTo(x, y + s); ctx.lineTo(x, y - s); ctx.moveTo(x - s * 0.75, y - s * 0.2); ctx.lineTo(x, y - s); ctx.lineTo(x + s * 0.75, y - s * 0.2); ctx.stroke();
}
function sparkle(x, y, r, c, rot = 0) {                             // four-point AI star
    const k = r * 0.16;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(r, 0);
    ctx.quadraticCurveTo(k, k, 0, r); ctx.quadraticCurveTo(-k, k, -r, 0); ctx.quadraticCurveTo(-k, -k, 0, -r); ctx.quadraticCurveTo(k, -k, r, 0);
    ctx.fill(); ctx.restore();
}
function check(x, y, r, c, lw) {
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    ctx.moveTo(x - r * 0.55, y); ctx.lineTo(x - r * 0.15, y + r * 0.4); ctx.lineTo(x + r * 0.6, y - r * 0.45); ctx.stroke();
}
function pointer(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
    for (const [px, py] of [[0, 0], [0, 34], [9, 26], [15, 40], [21, 37], [15, 24], [27, 24]]) ctx.lineTo(px, py);
    ctx.closePath(); ctx.fillStyle = WH; ctx.fill(); ctx.strokeStyle = BK; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
function sticker(x, y, s, c, ink, rot) {                            // "NEW" badge, slapped on
    if (s <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    rr(-62, -26, 124, 52, 26, c); txt('NEW', 0, 2, 24, { weight: 700, ls: 4, color: ink, align: 'center', base: 'middle' });
    ctx.restore();
}
function mark(c, hole, g = ctx) {                                   // the full logo; hole = letter colour, or null to cut them out
    g.fillStyle = c;
    g.fillRect(0, 0, LG.w, LG.bd); g.fillRect(0, 0, LG.bd, LG.blockY); g.fillRect(LG.w - LG.bd, 0, LG.bd, LG.blockY);
    g.fillRect(0, LG.blockY, LG.w, LG.h - LG.blockY);
    for (const [y, h] of LG.stripes) g.fillRect(LG.sx, y, LG.sw, h);
    for (const e of ELS) g.fillRect(e.lx, e.ly, e.n * LG.u, LG.rowH);
    if (!hole) g.globalCompositeOperation = 'destination-out';
    g.drawImage(hole ? atlas(hole) : img, LG.wm.x, LG.wm.y, img.width * LG.wm.k, img.height * LG.wm.k);
    g.globalCompositeOperation = 'source-over';
}
function sweep(p) {                                                 // orange with a highlight band crossing the mark
    if (p <= 0 || p >= 1) return OR;
    const x = lerp(-4000, LG.w + 4000, E.inOutCubic(p)), gr = ctx.createLinearGradient(x - 2600, 0, x + 2600, 1800);
    gr.addColorStop(0, OR); gr.addColorStop(0.44, OR); gr.addColorStop(0.5, '#FFC2AE'); gr.addColorStop(0.56, OR); gr.addColorStop(1, OR);
    return gr;
}
function shake(t, hits, amp) {
    let x = 0, y = 0;
    for (const h of hits) {
        const d = t - h;
        if (d < 0 || d > 0.6) continue;
        const e = amp * Math.exp(-d * 13);
        x += e * Math.sin(d * 97 + h * 13); y += e * Math.cos(d * 83 + h * 7);
    }
    return { x, y };
}
const BANDS = [8, 4, 2, 1, 0.5, 0.5];                               // the logo's stripes as a full-screen wipe
function bands(b, b0, c, cover) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    let y = 0;
    BANDS.forEach((u, i) => {
        const h = u / 16 * H, j = cover ? 5 - i : i, p = E.inOutExpo(prog(b, b0 + j * 0.07, b0 + j * 0.07 + 0.55)), w = W * (cover ? p : 1 - p);
        rect(i % 2 ? W - w : 0, y, w, h + 1, c);
        y += h;
    });
}

// ── HUD: crop marks, stage, timecode, and the pipeline filling up ──
const STAGES = [[0, 'IDEA'], [4, 'CODE'], [10, 'MOTION'], [16, 'AI'], [24, 'PROOF'], [30, 'SHIP']];
function hud(t, b, c) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = c;
    const m = 56, L = 34, th = 3;
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
        ctx.fillRect(x, y, sx * L, sy * th); ctx.fillRect(x, y, sx * th, sy * L);
    }
    const si = STAGES.findLastIndex(s => b >= s[0]), f = Math.floor(t * FPS + 1e-6), p2 = n => String(n).padStart(2, '0');
    txt(`${p2(si + 1)} — ${STAGES[si][1]}`, 64, 244, 22, { weight: 700, color: c, ls: 3 });
    txt(`00:00:${p2(Math.floor(f / FPS))}:${p2(f % FPS)}`, W - 64, 244, 22, { color: c, ls: 3, align: 'right' });
    const gap = 10, sw = (W - 128 - 5 * gap) / 6;
    STAGES.forEach(([s0], i) => {
        const s1 = STAGES[i + 1]?.[0] ?? BEATS, x = 64 + i * (sw + gap);
        ctx.globalAlpha = 0.25; rect(x, 272, sw, 4, c); ctx.globalAlpha = 1;
        rect(x, 272, sw * clamp((b - s0) / (s1 - s0)), 4, c);
    });
}

// ① IDEA — a prompt streams in, "incredible." slams, send: the arrow launches and we dive into the button.
const PROMPT = 'Build me something', PILLS = ['WEB', 'MOBILE', 'MOTION', 'AI'], BTN = [912, 1058];
function sIdea(t, b) {
    bg(BK);
    const z = E.inExpo(prog(b, 2.85, 4)), pan = E.inOutCubic(prog(b, 2.7, 4)), pin = E.outExpo(prog(b, 0, 0.7));
    cam(BTN[0], BTN[1], Math.exp(Math.log(90) * z), 0, lerp(BTN[0], W / 2, pan), lerp(BTN[1], H / 2, pan));
    ctx.translate(W / 2, 950); ctx.scale(lerp(0.92, 1, pin), lerp(0.92, 1, pin)); ctx.translate(-W / 2, -950);

    rise('YOUR IDEA.', 600, fit('YOUR IDEA.', 900, 160), b, 0.05, {}, 0.04);
    ctx.globalAlpha = pin;
    rr(90, 760, 900, 380, 44, '#151515'); rrs(90, 760, 900, 380, 44, 'rgba(255,255,255,.14)', 2);
    const n = clamp(Math.floor((b - 0.25) * 16) + 1, 0, PROMPT.length);
    if (!n) txt('Describe your idea…', 140, 885, 64, { font: SANS, weight: 700, color: '#4A4A4A' });
    chars(PROMPT.slice(0, n), 140, 885, 64, { weight: 700, align: 'left' }, i => {
        const q = prog(b, 0.25 + i / 16, 0.25 + i / 16 + 0.2);
        return [0, (1 - E.outCubic(q)) * 16, 1, 1, 0, clamp(q * 3)];
    });
    const sp = E.outExpo(prog(b, 1.5, 1.8));
    if (sp > 0) {
        ctx.save(); ctx.translate(140, 975); ctx.scale(lerp(1.7, 1, sp), lerp(1.7, 1, sp));
        txt('incredible.', 0, 0, 64, { font: SANS, weight: 900, color: OR, alpha: clamp(sp * 3) }); ctx.restore();
    }
    if (b < 2.6 && (n < PROMPT.length && n > 0 || Math.floor(b * 4) % 2 === 0)) {
        const cx = b < 1.5 ? 140 + tw(PROMPT.slice(0, n), 64, 700) : 140 + tw('incredible.', 64, 900);
        rect(cx + 6, b < 1.5 ? 836 : 926, 5, 62, OR);
    }
    let px = 130;
    PILLS.forEach((s, i) => {
        const w = tw(s, 22, 700, MONO, 2) + 40, q = prog(b, 1.75 + i * 0.25, 2 + i * 0.25), sc = q > 0 ? lerp(0.8, 1, E.outBack(q)) : 1;
        ctx.save(); ctx.translate(px + w / 2, 1058); ctx.scale(sc, sc);
        if (q > 0) rr(-w / 2, -26, w, 52, 26, OR); else rrs(-w / 2, -26, w, 52, 26, 'rgba(255,255,255,.25)', 2);
        txt(s, 0, 2, 22, { weight: 700, ls: 2, align: 'center', base: 'middle', color: q > 0 ? WH : GR });
        ctx.restore();
        px += w + 12;
    });
    const press = 1 - 0.15 * Math.sin(Math.PI * prog(b, 2.45, 2.75));
    circle(BTN[0], BTN[1], 46 * press, n ? OR : '#2A2A2A');
    const ring = E.outCubic(prog(b, 2.5, 3.1));
    if (ring > 0 && ring < 1) { ctx.globalAlpha = pin * (1 - ring); ctx.strokeStyle = OR; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 46 + ring * 150, 0, 7); ctx.stroke(); ctx.globalAlpha = pin; }

    ctx.globalAlpha = 1;
}

// ② CODE — code streams behind; a phone builds itself, gets tapped, then reflows into a desktop site.
const SRC = [
    "import 'package:flutter/material.dart';",
    "",
    "class SnowApp extends StatelessWidget {",
    "  @override",
    "  Widget build(BuildContext context) {",
    "    return MaterialApp(home: const HomePage());",
    "  }",
    "}",
    "@Component({ selector: 'app-hero', standalone: true })",
    "export class HeroComponent {",
    "  readonly title = signal('Everything matters');",
    "  readonly items = inject(ItemsService).items;",
    "}",
    "export function Hero({ title }: Props) {",
    "  const [open, setOpen] = useState(false);",
    "  return <section className=\"hero\">{title}</section>;",
    "}",
    "const res = await fetch('/api/projects');",
    "final curve = CurvedAnimation(parent: c, curve: Curves.easeOutExpo);",
    "animate(el, { y: [40, 0] }, { duration: 0.6 });",
    "export const routes: Routes = [{ path: '', component: Home }];",
    "await deploy({ target: 'production' });",
];
const SPANS = SRC.map(l => [...l.matchAll(/\b(import|export|class|extends|return|const|final|function|await|readonly|new)\b|'[^']*'|"[^"]*"|@\w+|\b[A-Z]\w*/g)]
    .map(m => [m.index, m.index + m[0].length, m[1] || m[0][0] === '@' ? OR : /^['"]/.test(m[0]) ? WH : '#C8C8C8']));
const BASE = SRC.map((l, i) => SPANS[i].reduce((s, [a, z]) => s.slice(0, a) + ' '.repeat(z - a) + s.slice(z), l));
function codeLayer(b, a) {
    if (a <= 0) return;
    const k = Math.max(0, (b - 3.7) * 8), cur = Math.floor(k), fr = k - cur, sh = E.outExpo(clamp(fr * 5)), LH = 46, y0 = 1700, X = 96;
    ctx.font = `400 26px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const cw = ctx.measureText('M').width;
    for (let i = Math.max(0, cur - 40); i <= cur; i++) {
        const y = y0 - (cur - i - 1 + sh) * LH, j = i % SRC.length, s = SRC[j], n = i < cur ? s.length : Math.floor(s.length * clamp(fr * 1.25));
        const al = a * (i === cur ? 2 : 1) * clamp((y - 520) / 300);
        ctx.globalAlpha = al * 0.5; ctx.fillStyle = GR; ctx.fillText(String(i + 1).padStart(3), 20, y);
        ctx.globalAlpha = al; ctx.fillStyle = '#777'; ctx.fillText(BASE[j].slice(0, n), X, y);
        for (const [s0, s1, c] of SPANS[j]) if (s0 < n) { ctx.fillStyle = c; ctx.fillText(s.slice(s0, Math.min(s1, n)), X + s0 * cw, y); }
        if (i === cur) { ctx.fillStyle = OR; ctx.fillRect(X + n * cw + 2, y - 24, 14, 30); }
    }
    ctx.globalAlpha = 1;
}
const DEV = [540, 1000], PHN = [430, 880], DSK = [960, 600];
const UI = [                                                        // [kind, phone rect, desktop rect], screen-local px
    ['logo', [28, 72, 36, 36], [32, 64, 30, 30]],
    ['nav', [340, 78, 62, 6], [736, 76, 70, 6]],
    ['nav', [360, 94, 42, 6], [830, 76, 98, 6]],
    ['hero', [28, 132, 374, 300], [500, 116, 428, 300]],
    ['h1', [28, 470, 320, 36], [32, 146, 410, 42]],
    ['h1', [28, 518, 230, 36], [32, 200, 300, 42]],
    ['p', [28, 576, 374, 12], [32, 270, 390, 12]],
    ['p', [28, 598, 290, 12], [32, 292, 320, 12]],
    ['btn', [28, 640, 200, 64], [32, 336, 200, 64]],
    ['card', [28, 736, 179, 120], [32, 448, 284, 124]],
    ['card', [223, 736, 179, 120], [338, 448, 284, 124]],
    ['card', [28, 884, 374, 120], [644, 448, 284, 124]],
];
function el(k, x, y, w, h) {
    if (k === 'logo') rr(x, y, w, h, 8, OR);
    else if (k === 'nav') rr(x, y, w, h, 3, 'rgba(255,255,255,.55)');
    else if (k === 'hero') { rr(x, y, w, h, 18, OR); for (const [fy, fh] of [[0.12, 0.22], [0.42, 0.11], [0.6, 0.055], [0.72, 0.028]]) rect(x + w * 0.08, y + h * fy, w * 0.84, h * fh, BK); }
    else if (k === 'h1') rr(x, y, w, h, 6, WH);
    else if (k === 'p') rr(x, y, w, h, 4, 'rgba(255,255,255,.3)');
    else if (k === 'btn') { rr(x, y, w, h, h / 2, OR); txt('Get started', x + w / 2, y + h / 2 + 1, 24, { font: SANS, weight: 700, align: 'center', base: 'middle' }); }
    else { rr(x, y, w, h, 16, '#1C1C1E'); rr(x + 18, y + 18, 30, 30, 8, OR); rr(x + 18, y + h - 42, w * 0.55, 9, 4, 'rgba(255,255,255,.6)'); rr(x + 18, y + h - 24, w * 0.35, 7, 3, 'rgba(255,255,255,.25)'); }

// ── live preview ──
if (!location.search.includes('render')) ready.then(() => {
    draw(parseFloat(new URLSearchParams(location.search).get('t')) || 0);
    cv.onclick = async () => {
        cv.onclick = null;
        const a = new AudioContext(), src = a.createBufferSource();
        src.buffer = await score(); src.loop = true; src.connect(a.destination);
        const t0 = a.currentTime + 0.1;
        src.start(t0);
        (function loop() { draw(Math.max(0, a.currentTime - t0) % DUR); requestAnimationFrame(loop); })();
    };
});
</script>
